# ============================================================================
# KKYX Spider 默认配置 (Default Configuration)
# ============================================================================
# 本文件定义所有配置项的默认值，随代码提交到 Git。
# 如需为本地环境覆盖某些项，请在【项目根目录】创建 .config.toml，
# 只填写需要修改的字段即可（与默认配置深度合并）。
#
# 配置优先级（从高到低）：
#   1. .config.toml            本地覆盖（可选，不提交到 Git，放项目根目录）
#   2. config.default.toml    本文件（默认值）
#
# 说明：账号 / 密码 / 密钥等敏感信息在本文件中一律留空，
#       真实值请写入根目录的 .config.toml。
# ============================================================================


# ----------------------------------------------------------------------------
# 敏感凭据 / 账号 (Sensitive Credentials)
# 默认留空；真实值写入根目录 .config.toml（不提交到 Git）
# ----------------------------------------------------------------------------
[kkyx]
username = ""    # KKYX 网站用户名（必需）
password = ""    # KKYX 网站密码（必需）

[cdn]
base_url = ""    # CDN 资源根地址（用于媒体上传与引用）


# ----------------------------------------------------------------------------
# 目标站点
# ----------------------------------------------------------------------------
[target_site]
base_url = "https://www.kkyx.net"
login_url = "https://www.kkyx.net/index.php?m=user&c=Users&a=login"
index_scan_start_url = "https://www.kkyx.net/update/"
index_scan_end_url = "https://www.kkyx.net/update/list_15_517/"
update_channel_page_template = "https://www.kkyx.net/update/list_15_{page_num}/"


# ----------------------------------------------------------------------------
# 抓取管道
# ----------------------------------------------------------------------------
[pipeline]
post_crawl_batch_limit = 5       # 单批次抓取帖子数
queue_max_size = 50              # 生产-消费队列最大容量
post_min_delay = 1               # 帖子间最小延迟（秒）
post_max_delay = 15              # 帖子间最大延迟（秒）
default_batch_count = 10         # 默认批次数
start_page = 1                   # 起始页码


# ----------------------------------------------------------------------------
# 安全限制（防止被目标站封禁）
# ----------------------------------------------------------------------------
[safety]
index_scan_page_limit = 2        # 单次运行扫描索引页上限
safe_threshold = 9
max_posts_per_run = 5            # 单次运行抓取帖子上限
max_retry_count = 3              # 单帖最大重试次数
browser_restart_interval = 10    # 浏览器重启间隔（按帖子数计）


# ----------------------------------------------------------------------------
# 调试
# ----------------------------------------------------------------------------
[debug]
debug_mode = true
debug_limit = 3
log_level = "DEBUG"


# ----------------------------------------------------------------------------
# 数据库 / 存储路径
# ----------------------------------------------------------------------------
[database]
db_dir = ".data/db"
db_file = ".data/db/kkyx_spider.db"
storage_dir = ".data/storage"


# ----------------------------------------------------------------------------
# 延迟策略
# 注：TOML 数组在加载时会被转换成 Python tuple（用于随机延迟范围）
# ----------------------------------------------------------------------------
[delays]
index_page_delay = [3, 7]             # 索引页之间的随机延迟范围
index_page_long_sleep_interval = 20    # 每隔多少页触发一次长睡眠
index_page_long_sleep = [30, 60]       # 长睡眠随机范围
soft_404_retry_wait = 60
soft_404_max_retries = 2
delay_index_min = 1
delay_index_max = 3
delay_detail_min = 10
delay_detail_max = 20


# ----------------------------------------------------------------------------
# 截图等本地路径
# ----------------------------------------------------------------------------
[paths]
screenshot_dir = ".screenshot"
screenshot_path = ".screenshot/debug_screenshot.png"


# ----------------------------------------------------------------------------
# WordPress 发布设置
# base_url / username / app_password 默认留空，真实值写入 .config.toml
# ----------------------------------------------------------------------------
[wordpress]
base_url = ""            # WordPress 站点根 URL
username = ""            # WordPress 管理员用户名
app_password = ""        # WordPress 应用密码（REST API 鉴权）
category_game = 68
ice_price = "5.00"
media_verify_ssl = false
media_timeout = 60
sync_batch_limit = 1
sync_interval = 2
sync_min_delay = 1
sync_max_delay = 3
max_retries = 3
retry_backoff_base = 2
fixed_tags = ["KKYX"]
tag_keywords = [
    "RPG", "动作", "模拟", "汉化", "策略",
    "冒险", "射击", "独立游戏", "单机游戏",
    "PC", "Steam", "中文",
]


# 分类名 → WordPress 分类 ID 映射（作为 wordpress 的子表）
[wordpress.category_map]
"默认" = 68
"动作" = 70
"独立游戏" = 75
